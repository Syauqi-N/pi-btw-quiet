name: Feature request
description: Suggest a change or addition
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Describe the situation where the current behaviour falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Does it respect the design constraints
      options:
        - label: It does not take focus away from the main editor
        - label: Any new key is opt-in (does not intercept normal typing)
        - label: It does not modify or abort the main agent's run
